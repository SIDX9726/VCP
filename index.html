<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SEPA Quant Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-mono p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Token Updater -->
        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <h1 class="text-xl font-bold text-emerald-400">⚡ Minervini SEPA Live Terminal</h1>
            <div class="flex gap-2">
                <input type="text" id="tokenInput" placeholder="Enter Kite Access Token" class="bg-slate-950 border border-slate-700 px-3 py-1 rounded text-sm w-72 focus:outline-none focus:border-emerald-500 text-emerald-300">
                <button onclick="updateToken()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1 rounded text-sm font-bold transition">Update Token</button>
            </div>
        </div>

        <!-- Memory / History Log -->
        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 shadow-lg">
            <h2 class="text-lg font-semibold mb-3 text-cyan-400">🧠 System Memory & Recommended Stocks History (Last 10 Days Performance)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="p-3">Stock</th>
                            <th class="p-3">Entry Date</th>
                            <th class="p-3">Entry Price</th>
                            <th class="p-3">Exit / Current Price</th>
                            <th class="p-3">PnL %</th>
                            <th class="p-3">Status / Reason</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody" class="divide-y divide-slate-800">
                        <tr><td colspan="6" class="p-4 text-center text-slate-500">Loading memory logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TradingView Chart Modal -->
    <div id="tv-modal" style="display:none;" class="fixed inset-0 bg-black/80 z-50 justify-center items-center p-6 backdrop-blur-sm">
        <div class="bg-[#1e222d] w-full max-w-6xl h-[85vh] rounded-xl border border-slate-700 shadow-2xl flex flex-col p-4 relative">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800">
                <h3 id="modal-stock-title" class="text-lg font-bold text-emerald-400">TradingView Chart</h3>
                <div class="flex gap-3">
                    <a id="tv-external-link" href="#" target="_blank" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded font-bold transition flex items-center">Open on TradingView ↗</a>
                    <button onclick="closeTvModal()" class="text-slate-400 hover:text-white text-xl font-bold px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 transition">✕ Close</button>
                </div>
            </div>
            <div id="tradingview_widget_container" class="w-full flex-1 rounded overflow-hidden"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://vcp-t2m6.onrender.com";

        async function updateToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if(!token) return alert("Token enter karo bhai!");
            try {
                let res = await fetch(`${API_URL}/api/update-token`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({access_token: token})
                });
                let data = await res.json();
                alert(data.message);
                document.getElementById('tokenInput').value = "";
            } catch(e) {
                alert("Error updating token: " + e);
            }
        }

        async function loadHistory() {
            try {
                let res = await fetch(`${API_URL}/api/history`);
                let data = await res.json();
                let tbody = document.getElementById('historyTableBody');
                if(!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-500">No trading memory found yet.</td></tr>`;
                    return;
                }
                tbody.innerHTML = "";
                data.forEach(item => {
                    let pnlColor = item.pnl_pct >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    tbody.innerHTML += `
                        <tr onclick="openTradingViewChart('${item.sym}')" class="hover:bg-slate-800/70 transition cursor-pointer group">
                            <td class="p-3 font-bold text-white group-hover:text-emerald-400">${item.sym} 📈</td>
                            <td class="p-3">${item.entry_date}</td>
                            <td class="p-3">₹${item.entry_price}</td>
                            <td class="p-3">₹${item.exit_price}</td>
                            <td class="p-3 font-bold ${pnlColor}">${item.pnl_pct > 0 ? '+' : ''}${item.pnl_pct.toFixed(2)}%</td>
                            <td class="p-3 text-xs">${item.reason}</td>
                        </tr>
                    `;
                });
            } catch(e) { console.error("Error loading history", e); }
        }

        function openTradingViewChart(symbol) {
            const modal = document.getElementById('tv-modal');
            modal.style.display = 'flex';
            document.getElementById('modal-stock-title').innerText = `${symbol} - Professional TradingView Chart`;
            
            // Direct external link fallback button for symbols not in embedded widget database
            document.getElementById('tv-external-link').href = `https://in.tradingview.com/chart/?symbol=NSE:${symbol}`;

            document.getElementById('tradingview_widget_container').innerHTML = "";

            new TradingView.widget({
                "width": "100%",
                "height": "100%",
                "symbol": "NSE:" + symbol,
                "interval": "D",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "in",
                "toolbar_bg": "#1e222d",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_widget_container"
            });
        }

        function closeTvModal() {
            document.getElementById('tv-modal').style.display = 'none';
            document.getElementById('tradingview_widget_container').innerHTML = "";
        }

        loadHistory();
        setInterval(loadHistory, 30000);
    </script>
</body>
</html>
